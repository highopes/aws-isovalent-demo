enabled: true
dnsPolicy: ClusterFirstWithHostNet
export:
  mode: fluentd
  fluentd:
    output: |-
      @type http
      endpoint http://hubble-timescape-ingester.kube-system.svc.cluster.local:4260/push
      http_method post
      <format>
        @type json
      </format>
      <buffer>
        flush_interval 1s
      </buffer>

