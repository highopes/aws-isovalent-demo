debug:
  enabled: false
  verbose: ~

cluster:
  name: k8s-demo-0
  id: 0

eni:
  enabled: true
  updateEC2AdapterLimitViaAPI: true
  awsEnablePrefixDelegation: true

enableIPv4Masquerade: false
loadBalancer:
  serviceTopology: true

ipam:
  mode: eni
routingMode: native

kubeProxyReplacement: "true"
k8sServiceHost: 3B05D3938AB03CD24BF2CCF2901592A9.sk1.ap-southeast-1.eks.amazonaws.com
k8sServicePort: 443

tls:
  ca:
    certValidityDuration: 3650

enterprise:
  featureGate:
    approved:
    - HubbleTimescape

hubble:
  enabled: true
  tls:
    enabled: true
    auto:
      enabled: true
      method: cronJob
      certValidityDuration: 1095
  relay:
    enabled: true
  timescape:
    enabled: true

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
operator:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
envoy:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
